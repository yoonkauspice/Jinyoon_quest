<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f6efe2">
<meta name="apple-mobile-web-app-title" content="마법 건축">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>진윤이의 마법 건축 여행</title>
<style>
:root{--bg:#f6efe2;--card:#fffdf8;--ink:#2b2a33;--accent:#c8553d;--green:#477a5b;--line:#d9cdb4;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:-apple-system,"Apple SD Gothic Neo",sans-serif;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
#app{height:100dvh;display:flex;flex-direction:column;gap:10px;padding:max(10px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex:0 0 auto}
.title{font-size:22px;font-weight:700}
.title span{font-size:15px;font-weight:500;color:#6b675c;margin-left:8px}
.tools{display:flex;gap:8px}
button{font:inherit;font-size:17px;min-height:48px;padding:0 16px;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--ink)}
button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
button.primary{background:var(--green);border-color:var(--green);color:#fff;font-weight:700}
main{flex:1 1 auto;min-height:0;display:flex;gap:12px}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;position:relative;overflow:hidden}
.work{flex:2 1 0;min-width:420px;display:flex;flex-direction:column;align-items:center;padding-top:14px}
.hint{margin:0 0 6px;font-size:15px;color:#7a766a}
#problem{display:grid;grid-template-columns:48px repeat(3,64px) 24px repeat(2,64px);justify-content:center}
#problem span{height:68px;display:flex;align-items:center;justify-content:center;font-size:54px;font-variant-numeric:tabular-nums}
#problem span.c{height:56px}
#problem span.sg{font-size:46px;color:var(--accent)}
#problem span.dt{font-weight:700}
#problem .bar{grid-column:1/-1;height:4px;background:var(--ink);border-radius:2px;margin:2px 0}
#scratch{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.answer{flex:3 1 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:14px}
.answer h2{margin:0;font-size:20px}
.cells{display:flex;align-items:flex-end;justify-content:center;gap:8px}
.cell{position:relative;width:96px;height:128px;background:#fff;border:2px solid var(--ink);border-radius:10px}
.cell canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;border-radius:8px}
.cell .x{position:absolute;top:-12px;right:-12px;width:32px;height:32px;min-height:0;padding:0;border-radius:50%;font-size:14px;line-height:1;z-index:2}
.dot{width:14px;height:14px;border-radius:50%;background:var(--ink);margin-bottom:12px}
.sub{font-size:14px;color:#7a766a;text-align:center;margin:0}
footer{flex:0 0 auto;font-size:13px;color:#6b675c}
details summary{cursor:pointer}
.dev{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px}
.dev button{min-height:36px;font-size:14px;padding:0 10px}
#msg{white-space:pre-wrap}
[hidden]{display:none!important}
#collect{flex:1 1 auto;min-height:0;display:flex;gap:28px;padding:12px 24px;align-items:center;justify-content:center}
.colleft{display:flex;flex-direction:column;align-items:center}
.colprompt{font-size:22px;margin:0 0 8px;text-align:center}
.colprompt b{font-size:64px;color:var(--accent);margin-left:10px;vertical-align:middle}
.colbox{position:relative;width:280px;height:384px;background:#fff;border:3px solid var(--ink);border-radius:16px}
.colbox canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;border-radius:13px}
.colside{display:flex;flex-direction:column;gap:12px;min-width:320px}
.colside h2{margin:0;font-size:20px}
.counts{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.ct{border:2px solid var(--line);border-radius:10px;padding:6px 0;text-align:center;font-size:22px;background:#fff}
.ct b{display:block;font-size:15px;color:#7a766a}
.ct.done{background:#e3f1e8;border-color:var(--green)}
.ct.done b{color:var(--green)}
.ct.now{border-color:var(--accent);border-width:3px}
.colrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#colMsg{min-height:22px;font-size:15px;color:var(--accent)}
.fb{width:100%;text-align:center;font-size:20px;min-height:24px;padding:0 8px}
.fb .big{font-size:60px;font-weight:700;letter-spacing:4px;margin:4px 0}
.fb .big i{font-style:normal}
.fb .big i.low{color:var(--accent);text-decoration:underline wavy}
.fb .ok{color:var(--green);font-size:34px;font-weight:700}
.fb .hint{background:#fff4e0;border:2px solid #f0c987;border-radius:12px;padding:10px;margin-top:6px;font-size:18px}
.fb button{margin:6px}
button.pulse{animation:pulse 1s infinite}
/* v0.8: 가로식(분수) 문제 + 대분수 답안 칸 */
main[data-mode=expr] .work{flex:3 1 0;min-width:0}
main[data-mode=expr] .answer{flex:2 1 0;min-width:440px}
#problem.expr{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px 8px;padding:4px 16px;font-size:42px;line-height:1;grid-template-columns:none}
#problem.expr span{height:auto;font-size:inherit}
.expr .a{display:inline-flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums}
.expr .op{color:var(--accent);padding:0 6px;font-size:.95em}
.expr .grp{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.expr .gltxt{font-size:.8em;margin-left:10px;white-space:nowrap}
.expr .gltxt b{margin-left:.3em}
.ladt{font-size:.5em;margin-bottom:14px;color:#4a4a42}.ladt b{color:var(--accent)}
.ladrow{display:flex;align-items:center;gap:22px}.ladbox{display:inline-block;width:64px;height:1.1em;border-bottom:2px solid #9a958a;margin-right:-8px}
.ladp{font-size:1.5em;font-weight:200;margin:0 -10px 0 -4px}.ladsub{font-size:.34em;color:#7a766a;margin-top:12px}
.ladrow .a{padding-bottom:2px;border-bottom:2px solid #9a958a}
.expr .par{font-size:1.7em;font-weight:200;line-height:1}
.fr{display:inline-flex;flex-direction:column;align-items:center;font-size:.78em;line-height:1.12;margin:0 2px;font-variant-numeric:tabular-nums}
.fr i{font-style:normal;padding:0 5px;min-width:1.2em;text-align:center}
.fr i:first-child{border-bottom:.07em solid var(--ink)}
.mx{display:inline-flex;align-items:center;gap:3px}
.mx b{font-weight:500;font-size:1.05em}
.cells.mixed{align-items:center;gap:22px}
.cells.mixed .cell{width:84px;height:108px}
.wg,.fgrow{display:flex;gap:8px}
.fg{display:flex;flex-direction:column;align-items:center;gap:6px}
.fbar{display:block;width:100%;height:5px;background:var(--ink);border-radius:3px}
.fb .big .fr{font-size:.7em;vertical-align:middle}
.fb .big .mx{vertical-align:middle}
.fb .ans{font-size:30px;font-weight:700}
.fb .ans .fr{font-size:.8em;vertical-align:middle}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(71,122,91,.25)}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="title">🇭🇺 헝가리 · 레벨 1<span><span id="lvl">소수 덧셈 · 뺄셈</span><button id="whoBtn" style="min-height:36px;font-size:14px;padding:0 10px;margin-left:10px">👤 아빠</button></div>
    <div class="tools">
      <button data-tool="pen" class="on">✏️ 펜</button>
      <button data-tool="eraser">🧽 지우개</button>
      <button id="undo">↩︎ 되돌리기</button>
      <button id="clearAll">🗑 모두 지우기</button>
      <button id="collectBtn">✋ 숫자 모으기</button>
      <button id="next" class="primary">다음 문제</button>
    </div>
  </header>
  <main data-mode="vert">
    <section class="card work" id="work">
      <p class="hint">풀이는 여기에 자유롭게 써도 돼요</p>
      <div id="problem"></div>
      <canvas id="scratch"></canvas>
    </section>
    <section class="card answer">
      <h2 id="ansTitle">답을 한 칸에 숫자 하나씩</h2>
      <div class="cells" id="cells"></div>
      <p class="sub" id="ansSub">점(.)은 이미 찍혀 있어요</p>
      <div><button id="check" class="primary" style="font-size:22px;min-height:56px;padding:0 28px">정답 확인</button></div>
      <div id="fb" class="fb"></div>
    </section>
  </main>
  <section id="collect" class="card" hidden>
    <div class="colleft">
      <p class="colprompt">이 숫자를 써 보자 <b id="colTarget">?</b></p>
      <div class="colbox"><canvas id="colCanvas"></canvas></div>
    </div>
    <div class="colside">
      <h2>모은 숫자 <span id="colTotal"></span></h2>
      <div class="counts" id="counts"></div>
      <div class="colrow">쓰는 사람
        <select id="who"><option>아빠</option><option>진윤</option></select>
        <span style="font-size:13px;color:#7a766a">(진윤이 글씨만 학습에 써요)</span>
      </div>
      <div class="colrow">
        <button id="colClear">지우기</button>
        <button id="colSave" class="primary">저장하고 다음</button>
      </div>
      <div class="colrow">
        <button id="colUndo">방금 저장 취소</button>
        <button id="colExport">내보내기</button>
        <button id="colReset">전부 삭제</button>
      </div>
      <div class="colrow">
        <button id="colRead">🔍 읽어 보기</button>
        <span id="colPred" style="font-size:20px"></span>
      </div>
      <div id="colMsg"></div>
    </div>
  </section>
  <footer>
    <details>
      <summary>개발자 메뉴 (아버지용) <span id="ver">· 앱 v0.10</span></summary>
      <div class="dev">
        <label>연산 <select id="op"><option value="+">덧셈</option><option value="-">뺄셈</option><option value="mix">섞기</option><option value="f2">분수·소수 2항 (가로식)</option><option value="f3">분수·소수 3항 (가로식)</option><option value="fp">분수·소수 괄호 (가로식)</option><option value="gcd">최대공약수 (2수)</option><option value="lcm">최소공배수 (2수)</option><option value="gl">공약수·공배수 섞기 (2수)</option><option value="gl3">공약수·공배수 섞기 (3수)</option><option value="ladL">공약수로 나누어 최소공배수 (구몬식)</option><option value="ladG">공약수로 나누어 최대공약수 (구몬식)</option><option value="lad">공약수로 나누기 섞기 (구몬식)</option></select></label>
        <label><input type="checkbox" id="allowMouse"> 마우스 허용(PC 테스트)</label>
        <button id="reveal">정답 보기</button>
        <button id="selftest">문제 생성기 자체 테스트</button>
        <button id="expAttempts">풀이 기록 내보내기</button>
        <label><input type="checkbox" id="autoCollect" checked> 맞힌 글씨 자동 수집</label>
      </div>
      <div id="msg"></div>
    </details>
  </footer>
</div>

<script>
const $=id=>document.getElementById(id);
const INT_CELLS=3, DEC_CELLS=2;
let tool='pen', lastInk=null, current=null;
const stats={last:'-',pressure:0,ignoredTouch:0,penStrokes:0};

/* ---------- 문제 생성기 (정수 x100으로 계산: 부동소수점 오차 없음) ---------- */
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
function randDec(){ // 소수 첫째/둘째 자리, 끝자리 0 없음
  const d=rnd(1,2), ip=rnd(1,99);
  const f=d===1 ? rnd(1,9)*10 : (()=>{let x;do{x=rnd(1,99)}while(x%10===0);return x})();
  return {s:ip*100+f,d};
}
function gen(opSel){
  const op=opSel==='mix'?(Math.random()<.5?'+':'-'):opSel;
  for(;;){
    let a=randDec(), b=randDec();
    if(op==='-'){ if(a.s<=b.s) continue; }
    const r=op==='+'?a.s+b.s:a.s-b.s;
    if(r<=0||r>=100000) continue;
    return {op,a,b,r};
  }
}
function fmt(s,d){return {i:String(Math.floor(s/100)),f:String(s%100).padStart(2,'0').slice(0,d)}}
function ansStr(r){const f=String(r%100).padStart(2,'0').replace(/0+$/,'');return String(Math.floor(r/100))+(f?'.'+f:'')}

/* ---------- v0.8 분수·소수 혼합 (유리수 정확 계산) ---------- */
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){const t=a%b;a=b;b=t;}return a;};
function Fr(n,d=1){ if(d===0) throw new Error('div0'); if(d<0){n=-n;d=-d;} const g=gcd(n,d)||1; n/=g; d/=g; if(Math.abs(n)>1e9||d>1e9) throw new Error('big'); return {n,d}; }
const fadd=(x,y)=>Fr(x.n*y.d+y.n*x.d,x.d*y.d), fsub=(x,y)=>Fr(x.n*y.d-y.n*x.d,x.d*y.d), fmul=(x,y)=>Fr(x.n*y.n,x.d*y.d), fdiv=(x,y)=>Fr(x.n*y.d,x.d*y.n);
const feq=(x,y)=>x.n===y.n&&x.d===y.d;
const PREC={'+':1,'−':1,'×':2,'÷':2};
function evalT(t){
  if(t.k==='num') return t.v;
  const a=evalT(t.l), b=evalT(t.r); let r;
  if(t.op==='+') r=fadd(a,b); else if(t.op==='−'){ r=fsub(a,b); if(r.n<=0) throw new Error('neg'); }
  else if(t.op==='×') r=fmul(a,b); else r=fdiv(a,b);
  if(r.d>5000||r.n>5000) throw new Error('ugly');   // 중간 계산이 너무 복잡한 문제는 버린다
  return r;
}
const pick=a=>a[rnd(0,a.length-1)];
const decStr=h=>{ let x=String(h%100).padStart(2,'0').replace(/0+$/,''); return String(Math.floor(h/100))+(x?'.'+x:''); };
const DENS=[2,3,4,5,6,7,8,9,10,12,15,20,24];
function coprimeNum(d){ for(;;){ const n=rnd(1,d-1); if(gcd(n,d)===1) return n; } }
function oDec(){ const two=[25,75,5,15,35,45,55,65,85,95,125,135,175,225,275,325]; const h=Math.random()<.4?pick(two):(()=>{let x;do{x=rnd(1,49)*10}while(x%100===0);return x})();
  return {k:'num',form:'dec',v:Fr(h,100),txt:decStr(h)}; }
function oFrac(){ const d=pick(DENS), n=coprimeNum(d); return {k:'num',form:'frac',v:Fr(n,d),n,d,txt:n+'/'+d}; }
function oMixed(){ const d=pick([2,3,4,5,6,8,10,12]), n=coprimeNum(d), w=rnd(1,6); return {k:'num',form:'mixed',v:Fr(w*d+n,d),w,n,d,txt:w+' '+n+'/'+d}; }
function oInt(){ const x=rnd(2,9); return {k:'num',form:'int',v:Fr(x,1),txt:String(x)}; }
function operands(k){ for(;;){ const a=[]; for(let i=0;i<k;i++){ const r=Math.random(); a.push(r<.34?oDec():r<.62?oFrac():r<.9?oMixed():oInt()); }
  if(a.some(x=>x.form==='dec')&&a.some(x=>x.form==='frac'||x.form==='mixed')) return a; } }
const B=(op,l,r,paren)=>({k:'bin',op,l,r,paren:!!paren});
const OPS=['+','−','×','÷'];
function needParens(t){ if(t.k==='num') return; for(const [side,c] of [['l',t.l],['r',t.r]]){ if(c.k==='bin'){
    if(PREC[c.op]<PREC[t.op]||(side==='r'&&PREC[c.op]===PREC[t.op]&&(t.op==='−'||t.op==='÷'))) c.paren=true; needParens(c); } } }
const okAns=v=>v.n>0&&v.n<=99&&v.d<=30&&v.n/v.d<60;
function buildTree(level){
  if(level==='f2'){ const [a,b]=operands(2); return B(pick(OPS),a,b); }
  if(level==='f3'){ const [a,b,c]=operands(3), o1=pick(OPS), o2=pick(OPS); return Math.random()<.5?B(o2,B(o1,a,b),c):B(o1,a,B(o2,b,c)); }
  const sh=pick(['P1','P2','P3']), pm=()=>pick(['+','−']), md=()=>pick(['×','÷']);
  if(sh==='P1'){ const [a,b,c]=operands(3); return B(md(),B(pm(),a,b,true),c); }
  if(sh==='P2'){ const [a,b,c]=operands(3); return B(pick(['×','÷','+','−']),a,B(pm(),b,c,true)); }
  const [a,b,c,d]=operands(4); return B(md(),B(pm(),a,b,true),B(pm(),c,d,true));
}
function exprText(t){ if(t.k==='num') return t.txt; const x=exprText(t.l)+' '+t.op+' '+exprText(t.r); return t.paren?'('+x+')':x; }
const frHTML=(n,d)=>`<span class="fr"><i>${n}</i><i>${d}</i></span>`;
const numHTML=t=>t.form==='frac'?`<span class="a">${frHTML(t.n,t.d)}</span>`:t.form==='mixed'?`<span class="a mx"><b>${t.w}</b>${frHTML(t.n,t.d)}</span>`:`<span class="a">${t.txt}</span>`;
function exprHTML(t){ if(t.k==='num') return numHTML(t); const x=exprHTML(t.l)+`<span class="op">${t.op}</span>`+exprHTML(t.r);
  return t.paren?`<span class="grp"><span class="par">(</span>${x}<span class="par">)</span></span>`:x; }
function genFrac(level){
  for(let i=0;i<20000;i++){
    try{ const t=buildTree(level); needParens(t); const v=evalT(t); if(!okAns(v)) continue;
      return {kind:'expr',op:level,tree:t,ans:v,exprTxt:exprText(t),field:{type:'mixed',whole:2,num:2,den:2}}; }catch(e){}
  } throw new Error('문제 생성 실패');
}

/* ---------- 공약수·공배수 ---------- */
const lcm2=(a,b)=>a/gcd(a,b)*b, gcdN=a=>a.reduce(gcd), lcmN=a=>a.reduce(lcm2);
const ri=(lo,hi)=>lo+Math.floor(Math.random()*(hi-lo+1));
function ladSteps(a,b){ const dv=[]; let x=a,y=b; for(;;){ let p=0; for(let q=2;q<=Math.min(x,y);q++) if(x%q===0&&y%q===0){p=q;break;} if(!p) break; dv.push(p); x/=p; y/=p; } return {dv,rest:[x,y]}; }
function genLad(op){ // 구몬식: 공약수로 나누어 최소공배수/최대공약수. 두 수는 서로소가 아니고(사다리가 시작됨), 순서는 섞는다
  const kind=op==='ladL'?'lcm':op==='ladG'?'gcd':(Math.random()<.5?'lcm':'gcd');
  for(let i=0;i<20000;i++){
    const g=ri(2,12), m1=ri(1,9), m2=ri(1,9); if(m1===m2) continue;
    let nums=[g*m1,g*m2]; if(Math.max(...nums)>60||Math.min(...nums)<4) continue;
    const L=lcm2(nums[0],nums[1]); if(L>300) continue;
    if(Math.random()<.5) nums.reverse();
    const ans=kind==='lcm'?L:gcd(nums[0],nums[1]); if(ans<2) continue;
    return {kind:'num',op:kind,lad:true,nums,ans,exprTxt:nums.join(', ')+' → '+(kind==='lcm'?'최소공배수':'최대공약수')+'(공약수로 나누기)',field:{type:'int',n:4}};
  } throw new Error('문제 생성 실패');
}
function genGL(op){
  if(op==='ladL'||op==='ladG'||op==='lad') return genLad(op);
  const kind=op==='gcd'||op==='lcm'?op:(Math.random()<.5?'gcd':'lcm'), three=op==='gl3';
  for(let i=0;i<20000;i++){
    let nums;
    if(kind==='gcd'){
      const g=ri(2,three?8:12), ms=Array.from({length:three?3:2},()=>ri(1,three?9:10));
      if(gcdN(ms)!==1||new Set(ms).size<ms.length) continue;
      nums=ms.map(m=>g*m);
      if(Math.max(...nums)>99) continue;
    } else {
      const k=three?3:2; nums=Array.from({length:k},()=>ri(2,three?24:36));
      if(new Set(nums).size<k) continue;
      if(nums.some(x=>nums.some(y=>y!==x&&y%x===0))) continue;       // 한 수가 다른 수의 약수인 뻔한 경우 제외
      const L=lcmN(nums); if(L>999||L<=Math.max(...nums)) continue;
      if(three&&L===nums.reduce((p,q)=>p*q,1)) continue;
    }
    nums.sort((a,b)=>a-b);
    const ans=kind==='gcd'?gcdN(nums):lcmN(nums);
    if(kind==='gcd'&&ans<2) continue;
    return {kind:'num',op:kind,nums,ans,exprTxt:nums.join(', ')+' → '+(kind==='gcd'?'최대공약수':'최소공배수'),field:{type:'int',n:4}};
  } throw new Error('문제 생성 실패');
}

class Ink{
  constructor(canvas){this.c=canvas;this.ctx=canvas.getContext('2d');this.strokes=[];this.cur=null;this.pid=null;this.fit();}
  fit(){const r=this.c.getBoundingClientRect(),d=window.devicePixelRatio||1;
    this.w=r.width;this.h=r.height;this.c.width=Math.round(r.width*d);this.c.height=Math.round(r.height*d);
    this.ctx.setTransform(d,0,0,d,0,0);this.ctx.lineCap='round';this.ctx.lineJoin='round';this.ctx.strokeStyle='#1d2a4a';this.redraw();}
  pt(e){const r=this.c.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height,p:e.pressure>0?e.pressure:.5}}
  seg(a,b){const x=this.ctx;x.lineWidth=2+b.p*3;x.beginPath();x.moveTo(a.x*this.w,a.y*this.h);x.lineTo(b.x*this.w,b.y*this.h);x.stroke();}
  dot(a){const x=this.ctx;x.fillStyle='#1d2a4a';x.beginPath();x.arc(a.x*this.w,a.y*this.h,1+a.p*2,0,7);x.fill();}
  redraw(){this.ctx.clearRect(0,0,this.w,this.h);
    for(const s of this.strokes){ if(s.pts.length===1)this.dot(s.pts[0]); for(let i=1;i<s.pts.length;i++)this.seg(s.pts[i-1],s.pts[i]); }}
  erase(p){const px=p.x*this.w,py=p.y*this.h,n=this.strokes.length;
    this.strokes=this.strokes.filter(s=>!s.pts.some(q=>Math.hypot(q.x*this.w-px,q.y*this.h-py)<16));
    if(this.strokes.length!==n)this.redraw();}
  clear(){this.strokes=[];this.redraw();}
  undo(){this.strokes.pop();this.redraw();}
}
const allowMouse=()=>$('allowMouse').checked;
const allowed=e=>e.pointerType==='pen'||(allowMouse()&&e.pointerType==='mouse');
function showStats(){ $('msg').dataset.stats=`마지막 입력: ${stats.last} / 압력 ${stats.pressure.toFixed(2)} / 무시된 터치 ${stats.ignoredTouch}회 / 펜 획 ${stats.penStrokes}`; renderMsg(); }
let extra='';

function attach(ink){
  const c=ink.c;
  c.addEventListener('pointerdown',e=>{
    stats.last=e.pointerType; stats.pressure=e.pressure||0;
    if(!allowed(e)){ if(e.pointerType==='touch')stats.ignoredTouch++; showStats(); return; } // 손가락·손바닥은 무시
    e.preventDefault(); c.setPointerCapture(e.pointerId); ink.pid=e.pointerId; lastInk=ink;
    const p=ink.pt(e);
    if(tool==='eraser'){ ink.erase(p); }
    else{ ink.cur={pts:[p]}; ink.strokes.push(ink.cur); ink.dot(p); stats.penStrokes++; }
    showStats();
  });
  c.addEventListener('pointermove',e=>{
    if(e.pointerId!==ink.pid)return; e.preventDefault();
    const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
    for(const ev of evs){ const p=ink.pt(ev); stats.pressure=ev.pressure||0;
      if(tool==='eraser'){ ink.erase(p); }
      else if(ink.cur){ const prev=ink.cur.pts[ink.cur.pts.length-1]; ink.cur.pts.push(p); ink.seg(prev,p); } }
  });
  const end=e=>{ if(e.pointerId===ink.pid){ink.pid=null;ink.cur=null;} };
  c.addEventListener('pointerup',end); c.addEventListener('pointercancel',end);
  c.addEventListener('contextmenu',e=>e.preventDefault());
}

// MNIST 방식: 글씨 영역을 20px로 맞춰 28x28 중앙에 배치, 알파값 0~255 784개
function bitmap(strokes,w,h){
  const pts=strokes.flatMap(s=>s.pts); if(!pts.length) return null;
  const xs=pts.map(p=>p.x*w), ys=pts.map(p=>p.y*h);
  const x0=Math.min(...xs), x1=Math.max(...xs), y0=Math.min(...ys), y1=Math.max(...ys);
  const sc=20/Math.max(x1-x0,y1-y0,1);
  const ox=14-(x0+x1)/2*sc, oy=14-(y0+y1)/2*sc;
  const cv=document.createElement('canvas'); cv.width=cv.height=28;
  const c=cv.getContext('2d'); c.lineCap='round'; c.lineJoin='round'; c.strokeStyle='#fff'; c.fillStyle='#fff'; c.lineWidth=2;
  const T=p=>[p.x*w*sc+ox, p.y*h*sc+oy];
  for(const s of strokes){
    if(s.pts.length===1){ const [x,y]=T(s.pts[0]); c.beginPath(); c.arc(x,y,1,0,7); c.fill(); continue; }
    c.beginPath(); s.pts.forEach((p,i)=>{ const [x,y]=T(p); i?c.lineTo(x,y):c.moveTo(x,y); }); c.stroke();
  }
  const d=c.getImageData(0,0,28,28).data, out=[]; for(let i=0;i<784;i++) out.push(d[i*4+3]); return out;
}

let MODEL=null;
async function loadModel(){
  if(MODEL) return MODEL;
  const m=await (await fetch('model.json')).json();
  const dec=b=>{const bin=atob(b),a=new Int8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i)<<24>>24;return a;};
  MODEL={H:m.hidden,w1:dec(m.w1),s1:m.s1,b1:m.b1,w2:dec(m.w2),s2:m.s2,b2:m.b2};
  try{ $('ver').textContent=`· 앱 v0.10 · 모델 v${m.v} (${m.n_real}장)`; }catch(e){}
  return MODEL;
}
function predict(img){ // img: 784개(0~255) -> 확률 10개
  const M=MODEL,H=M.H,h=new Float32Array(H);
  for(let j=0;j<H;j++)h[j]=M.b1[j];
  for(let i=0;i<784;i++){const v=img[i]/255; if(v===0)continue; const o=i*H*1, f=v*M.s1; for(let j=0;j<H;j++)h[j]+=f*M.w1[o+j];}
  const z=new Float32Array(10); for(let k=0;k<10;k++)z[k]=M.b2[k];
  for(let j=0;j<H;j++){const v=h[j]>0?h[j]:0; if(v===0)continue; const f=v*M.s2, o=j*10; for(let k=0;k<10;k++)z[k]+=f*M.w2[o+k];}
  const mx=Math.max(...z); let sum=0; const e=[...z].map(x=>{const t=Math.exp(x-mx);sum+=t;return t;});
  return e.map(t=>t/sum);
}
const CONF_OK=0.85; // 이보다 낮으면 "이 숫자 맞아?" 되묻기 (4.4에서 값 조정)
$('colRead').addEventListener('click',async()=>{
  const st=collectInk.strokes.filter(s=>s.pts.length>0);
  if(!st.length){ flash('먼저 숫자를 써 주세요'); return; }
  try{ await loadModel(); }catch(e){ flash('인식 모델을 불러오지 못했어요'); return; }
  const r=collectInk.c.getBoundingClientRect(), p=predict(bitmap(st,r.width,r.height));
  const ord=[...p.keys()].sort((a,b)=>p[b]-p[a]), a=ord[0], b=ord[1];
  const pct=x=>Math.round(x*100)+'%';
  $('colPred').textContent = p[a]>=CONF_OK
    ? `${a} (확신 ${pct(p[a])})${a===target?' ✅':' ❌ 목표는 '+target}`
    : `헷갈려요: ${a}(${pct(p[a])}) 또는 ${b}(${pct(p[b])})?`;
});
window.addEventListener('resize',()=>{ if(collecting&&collectInk) collectInk.fit(); });


/* ---------- 4.4 정답 칸 인식 + 자동 채점 ---------- */
const AKEY='jq_attempts_v1';
let attempts=[]; try{ attempts=JSON.parse(localStorage.getItem(AKEY)||'[]'); }catch(e){ attempts=[]; }
function persistAttempts(){ try{ localStorage.setItem(AKEY,JSON.stringify(attempts)); return true; }catch(e){ return false; } }
let ps={n:0,rejects:0,done:false,t0:Date.now(),pending:null,rej:[]};
function resetSolve(){ ps={n:0,rejects:0,done:false,t0:Date.now(),pending:null,rej:[]}; $('fb').innerHTML=''; $('next').classList.remove('pulse'); $('check').disabled=false; }
function syncWho(){ $('whoBtn').textContent='👤 '+curWho(); }
$('whoBtn').addEventListener('click',()=>{ $('who').value=curWho()==='아빠'?'진윤':'아빠'; $('who').dispatchEvent(new Event('change')); });
$('who').addEventListener('change',syncWho); syncWho();

function readCells(){ // 정답 칸 5개 -> 각 칸의 읽은 숫자(빈 칸/낙서는 null)
  return cellInks.map(ink=>{
    const st=ink.strokes.filter(s=>s.pts.length>0); if(!st.length) return null;
    const r=ink.c.getBoundingClientRect(), pts=st.flatMap(s=>s.pts);
    const xs=pts.map(q=>q.x*r.width), ys=pts.map(q=>q.y*r.height);
    if(Math.max(Math.max(...xs)-Math.min(...xs),Math.max(...ys)-Math.min(...ys))<10) return null; // 점 하나 같은 낙서는 빈 칸으로 본다
    const img=bitmap(st,r.width,r.height), p=predict(img), o=[...p.keys()].sort((a,b)=>p[b]-p[a]);
    return {d:o[0],conf:p[o[0]],d2:o[1],p2:p[o[1]],st,w:r.width,h:r.height,img};
  });
}
const digSpan=(i,d,cells)=>`<i class="${cells[i]&&cells[i].conf<CONF_OK?'low':''}">${d}</i>`;
function assembleDec(cells){ // 정수 3칸(오른쪽 정렬) + 소수 2칸(왼쪽 정렬)
  const I=cells.slice(0,3), F=cells.slice(3,5);
  const pi=I.map(c=>c?'1':'0').join(''), pf=F.map(c=>c?'1':'0').join('');
  if(pi==='000'&&pf==='00') return {status:'empty'};
  if(!['000','001','011','111'].includes(pi)) return {status:'gap',msg:'숫자는 소수점 바로 앞 칸부터 채워서 써 줘 ✏️'};
  if(!['00','10','11'].includes(pf)) return {status:'gap',msg:'소수점 바로 뒤 칸부터 차례로 써 줘 ✏️'};
  let ints=[],fr=[];
  I.forEach((c,i)=>{ if(c) ints.push([i,c.d]); }); F.forEach((c,i)=>{ if(c) fr.push([i+3,c.d]); });
  while(ints.length>1&&ints[0][1]===0) ints.shift();      // 앞쪽 0 무시
  if(!ints.length) ints=[[null,0]];                        // 정수 칸이 비면 0으로 본다
  while(fr.length&&fr[fr.length-1][1]===0) fr.pop();      // 뒤쪽 0 무시 (4.50 = 4.5)
  const str=ints.map(x=>x[1]).join('')+(fr.length?'.'+fr.map(x=>x[1]).join(''):'');
  const digits=[...ints.filter(x=>x[0]!==null),...fr], part=arr=>arr.map(([i,d])=>digSpan(i,d,cells)).join('');
  return {status:'ok',str,text:str,ints,fr,digits,used:digits.map(x=>x[0]),html:part(ints)+(fr.length?'.'+part(fr):'')};
}
function grpRead(cells,from,n){ // 한 묶음(정수/분자/분모): 칸을 건너뛰지 않고 이어서 쓴 경우만 인정
  const pat=cells.slice(from,from+n).map(c=>c?'1':'0').join('');
  if(!/^0*1*0*$/.test(pat)) return {gap:true};
  const idx=[...Array(n).keys()].map(i=>from+i).filter(i=>cells[i]);
  return {idx,str:idx.map(i=>cells[i].d).join('')};
}
function assembleMixed(cells){ // [정수 2칸][분자 2칸 / 분모 2칸]
  const f=current.field, W=grpRead(cells,0,f.whole), N=grpRead(cells,f.whole,f.num), D=grpRead(cells,f.whole+f.num,f.den);
  if(W.gap||N.gap||D.gap) return {status:'gap',msg:'숫자는 칸을 건너뛰지 말고 이어서 써 줘 ✏️'};
  if(!W.str&&!N.str&&!D.str) return {status:'empty'};
  if(!!N.str!==!!D.str) return {status:'gap',msg:'분수는 분자(위)와 분모(아래)를 모두 써 줘 ✏️'};
  const hasW=!!W.str, hasFrac=!!N.str, w=hasW?parseInt(W.str,10):0, n=hasFrac?parseInt(N.str,10):0, d=hasFrac?parseInt(D.str,10):1;
  if(hasFrac&&d===0) return {status:'gap',msg:'분모는 0이 될 수 없어. 다시 써 볼까? ✏️'};
  const val=hasFrac?Fr(w*d+n,d):Fr(w,1), used=[...W.idx,...N.idx,...D.idx], digits=used.map(i=>[i,cells[i].d]);
  const sp=g=>g.idx.map(i=>digSpan(i,cells[i].d,cells)).join('');
  const html=(hasW?`<span class="mx"><b>${sp(W)}</b>`:'')+(hasFrac?`<span class="fr"><i>${sp(N)}</i><i>${sp(D)}</i></span>`:'')+(hasW?'</span>':'');
  const text=(hasW?w:'')+(hasW&&hasFrac?' ':'')+(hasFrac?n+'/'+d:'');
  return {status:'ok',hasW,hasFrac,w,n,d,val,text,html,digits,used,improper:hasFrac&&!hasW&&n>d};
}
function assembleInt(cells){ // 정수 n칸: 칸을 건너뛰지 않고 이어서 쓴 경우만 인정, 앞쪽 0은 무시
  const G=grpRead(cells,0,current.field.n);
  if(G.gap) return {status:'gap',msg:'숫자는 칸을 건너뛰지 말고 이어서 써 줘 ✏️'};
  if(!G.str) return {status:'empty'};
  const str=String(parseInt(G.str,10)), sp=G.idx.map(i=>digSpan(i,cells[i].d,cells)).join('');
  return {status:'ok',str,text:str,digits:G.idx.map(i=>[i,cells[i].d]),used:G.idx.slice(),html:sp};
}
const assemble=cells=>current.field.type==='int'?assembleInt(cells):current.field.type==='mixed'?assembleMixed(cells):assembleDec(cells);
const ansTextCur=()=>current.kind==='num'?String(current.ans):current.kind==='expr'?ansText(current.ans):ansStr(current.r);
const ansHTMLCur=()=>current.kind==='num'?String(current.ans):current.kind==='expr'?ansHTML(current.ans):ansStr(current.r);
function judge(a){ // 'correct' | 'unreduced'(값은 맞지만 약분 덜 됨) | 'wrong'
  if(current.field.type==='int') return a.str===String(current.ans)?'correct':'wrong';
  if(current.field.type==='dec') return a.str===ansStr(current.r)?'correct':'wrong';
  if(!feq(a.val,current.ans)) return 'wrong';
  if(a.hasFrac&&(gcd(a.n,a.d)>1||(a.hasW&&a.n>=a.d))) return 'unreduced';
  return 'correct';
}
function fbMsg(m){ $('fb').innerHTML=`<div>${m}</div>`; }
function clearCells(){ cellInks.forEach(i=>i.clear()); }
function fa(n){ const f=fmt(n.s,n.d); return f.i+'.'+f.f; }
function logAttempt(decision,a,cells,exp,n){
  const dec=current.kind==='dec';
  attempts.push({id:Date.now()+'-'+Math.random().toString(36).slice(2,6),t:new Date().toISOString(),who:curWho(),
    type:current.field.type,op:current.op,a:dec?fa(current.a):current.exprTxt,b:dec?fa(current.b):null,expected:exp,read:a?a.text:null,decision,n,rejects:ps.rejects,ms:Date.now()-ps.t0,
    cells:cells.map(c=>c?{d:c.d,conf:+c.conf.toFixed(3),d2:c.d2,p2:+c.p2.toFixed(3)}:null)});
  persistAttempts();
}
function todayLine(){
  const day=new Date().toLocaleDateString('sv'); const n=attempts.filter(x=>x.who===curWho()&&x.decision==='correct'&&new Date(x.t).toLocaleDateString('sv')===day).length;
  return `<div style="font-size:14px;color:#7a766a">오늘 맞힌 문제 ${n}개</div>`;
}
function sampleOf(c,label,extra){ return Object.assign({id:Date.now()+'-'+Math.random().toString(36).slice(2,6),label,who:curWho(),t:new Date().toISOString(),w:Math.round(c.w),h:Math.round(c.h),
  strokes:c.st.map(s=>s.pts.map(q=>[+q.x.toFixed(3),+q.y.toFixed(3),+q.p.toFixed(2)])),img:c.img},extra); }
function autoCollect(a,cells){ // 맞힌 답은 정답을 알고 있으므로 라벨이 확실하다 -> 학습 샘플로 쌓는다
  if(!$('autoCollect').checked||samples.length>2500) return;
  a.used.forEach(i=>{ const c=cells[i]; if(c) samples.push(sampleOf(c,c.d,{src:'solve',field:current.field.type,role:cellInks[i].role})); });
  if(!persist()){ a.used.forEach(()=>samples.pop()); }
}
function harvestRejected(a){ // '아니야'로 거절된 칸 = 모델이 틀리게 읽은 사례. 최종 정답의 자리별 숫자를 라벨로 쓴다
  if(!$('autoCollect').checked||samples.length>2500||!ps.rej.length) return;
  const lab={}; a.digits.forEach(([i,d])=>{ lab[i]=d; });
  const key=JSON.stringify(a.used); let n=0;
  ps.rej.forEach(r=>{ if(JSON.stringify(r.used)!==key) return;      // 칸 배치가 같을 때만 (라벨 오염 방지)
    r.used.forEach(i=>{ const c=r.cells[i]; if(!c) return;
      samples.push(sampleOf(c,lab[i],{src:'solve-rej',field:current.field.type,role:cellInks[i].role,read:c.d,conf:+c.conf.toFixed(3)})); n++; }); });
  if(n&&!persist()){ for(let k=0;k<n;k++) samples.pop(); }
}
function hintFor(n,exp){
  if(current.kind==='num'&&current.lad){ const [a,b]=current.nums, st=ladSteps(a,b), p=st.dv[0], dvs=st.dv.join(' × ');
    if(n===1) return `둘을 같이 나눌 수 있는 수(1 말고)로 나눠 봐. 먼저 ${p}로 나누면 ${a/p}와 ${b/p}가 돼.`+(current.op==='lcm'?' 더 나눌 수 없을 때까지 계속!':'');
    return current.op==='lcm'?`나눈 공약수 ${st.dv.join(', ')}와 마지막에 남은 수 ${st.rest.join(', ')}를 모두 곱해 보자!`
      :`나눈 공약수 ${st.dv.join(', ')}를 모두 곱하면 돼. 남은 수는 곱하지 않아!`; }
  if(current.kind==='num'){ const N=current.nums, mn=N[0], mx=N[N.length-1], len=exp.length;
    if(current.op==='gcd') return n===1?`공통으로 나눌 수 있는 수 중 가장 큰 수야. ${mn}의 약수부터 찾아서 ${N.length>2?'나머지 수':mx}도 나누는지 확인해 봐!`
        :`답은 ${mn}보다 크지 않아. 두 수를 같이 나눌 수 있는 수로 계속 나눠 봐 (답은 ${len}자리).`;
    return n===1?`모든 수의 배수가 되는 가장 작은 수야. 가장 큰 수 ${mx}의 배수를 차례로 써서 확인해 봐!`
        :`답은 ${mx}의 배수이고 ${len}자리 수야. 다시 확인해 보자!`; }
  if(current.kind==='expr'){ const A=current.ans;
    return n===1?'계산 순서를 확인해 봐: 괄호 → × ÷ → + − 순서! 소수는 분수로 바꿔서 계산하면 편해.'
      :(A.d===1?'답은 자연수야. 다시 계산해 보자!':`약분까지 한 답의 분모는 ${A.d}이야. 다시 계산해 보자!`); }
  const dec=(exp.split('.')[1]||'').length, d=dec?`답의 소수점 아래는 ${dec}자리야`:'답은 소수점이 없는 수야';
  if(n===1) return `소수점끼리 줄을 맞춰서 ${current.op==='+'?'더해 봐. 받아올림':'빼 봐. 받아내림'}도 확인! (${d})`;
  return `답의 소수점 위 숫자는 ${exp.split('.')[0]}이야. 소수점 아래를 다시 계산해 보자!`;
}
function finishDone(){ ps.done=true; $('check').disabled=true; $('next').classList.add('pulse'); }
async function check(){
  if(ps.done) return;
  try{ await loadModel(); }catch(e){ fbMsg('인식 모델을 불러오지 못했어요. 인터넷 연결을 확인해 줘'); return; }
  const cells=readCells(), a=assemble(cells);
  if(a.status==='empty'){ fbMsg('먼저 답을 써 보자 ✏️'); return; }
  if(a.status==='gap'){ fbMsg(a.msg); return; }
  const exp=ansTextCur(), v=judge(a);
  if(v==='correct'){
    ps.n++; logAttempt('correct',a,cells,exp,ps.n); autoCollect(a,cells); harvestRejected(a); finishDone();
    $('fb').innerHTML=`<div class="ok">정답! 🎉</div><div>${ps.n===1?'한 번에 맞혔어!':ps.n+'번째에 맞혔어!'}</div>`+
      (a.improper&&current.ans.d>1?`<div style="font-size:16px">대분수로 쓰면 <span class="ans">${ansHTMLCur()}</span> 이야</div>`:'')+todayLine();
    return;
  }
  if(v==='unreduced'){ // 값은 맞다 -> 오답이 아니라 약분 안내 (시도 횟수는 쓰지 않는다)
    logAttempt('unreduced',a,cells,exp,ps.n); clearCells();
    fbMsg(a.hasW&&a.n>=a.d?'값은 맞아! 😀 분수 부분이 1보다 작게 써 볼까?':'값은 맞아! 😀 그런데 더 약분할 수 있어. 약분해서 다시 써 볼까?'); return;
  }
  // 다르게 읽혔다 -> 오답으로 단정하지 않고 읽은 값을 보여주고 확인한다
  ps.pending={a,cells,exp};
  const low=a.digits.some(([i])=>cells[i]&&cells[i].conf<CONF_OK);
  $('fb').innerHTML=`<div>이렇게 읽었어. 맞아?</div><div class="big">${a.html}</div>`+(low?'<div style="font-size:14px;color:#7a766a">물결 밑줄은 잘 모르겠는 숫자야</div>':'')+
    '<button id="yes" class="primary">맞아</button><button id="no">아니야, 다시 쓸게</button>';
  $('yes').onclick=confirmYes; $('no').onclick=confirmNo;
}
function confirmYes(){
  const {a,cells,exp}=ps.pending; ps.pending=null; ps.n++; logAttempt('wrong',a,cells,exp,ps.n);
  if(ps.n>=3){ finishDone(); $('fb').innerHTML=`<div class="hint">괜찮아, 어려웠지? 정답은 <span class="ans">${ansHTMLCur()}</span>이야.<br>풀이를 같이 확인해 보자.</div>`+todayLine(); return; }
  clearCells();
  $('fb').innerHTML=`<div class="hint">아깝다! 다시 해 보자 💪<br>${hintFor(ps.n,exp)}</div><div style="font-size:14px;color:#7a766a">남은 기회 ${3-ps.n}번</div>`;
}
function confirmNo(){
  const {a,cells,exp}=ps.pending; ps.pending=null; ps.rejects++; logAttempt('reread',a,cells,exp,ps.n);
  ps.rej.push({used:a.used.slice(),cells}); // 같은 문제를 나중에 맞히면 정답 숫자를 라벨로 붙여 학습 샘플로 쓴다
  clearCells(); fbMsg('다시 써 줘 ✏️ 칸에 또박또박!');
}
$('check').addEventListener('click',check);
async function saveJSON(name,obj){
  const file=new File([JSON.stringify(obj)],name,{type:'application/json'});
  try{ if(navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:name}); return; } }catch(e){ if(e.name==='AbortError') return; }
  const a=document.createElement('a'); a.href=URL.createObjectURL(file); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1000);
}
$('expAttempts').addEventListener('click',()=>saveJSON('jinyoon-attempts-'+new Date().toISOString().slice(0,10)+'.json',{app:'jinyoon-quest',schema:1,exportedAt:new Date().toISOString(),attempts}));
loadModel().catch(()=>{});

scratch=new Ink($('scratch')); attach(scratch);
newProblem();

if('serviceWorker' in navigator){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
